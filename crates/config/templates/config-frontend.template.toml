# TCP network port
# - Default: 5252
port = {port}

# Maximum log level
# - Options: "off", "error", "warn", "info", "debug"
# - Default: "info"
log_level = {log_level}

# Enable HTTPS mode
# - Default: false
enable_tls = {enable_tls}
# Path to TLS certificate
cert_path = {cert_path}
# Path to TLS private key
key_path = {key_path}

# Enable password auth
# - Default: false
enable_auth = {enable_auth}
# Random secret used to verify token
secret = {secret}
# SHA-512 hash of password
hash = {hash}
# Expiry time of login token in seconds
# - Default: 3600
expiry = {expiry}

CONFIG_VERSION_DO_NOT_CHANGE = 1
